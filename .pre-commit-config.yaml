repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe'] # Allow custom yaml tags if any

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true

  # Repo-local: the twin and the portfolio state the same credentials in five
  # files with nothing linking them. They drifted once and the twin claimed an
  # AWS certification that was never earned. Pure stdlib, no AWS, no network.
  - repo: local
    hooks:
      - id: certifications-generated
        name: data/05_certifications.txt is generated, not hand-edited
        entry: python3 scripts/generate_certifications.py --check
        language: system
        pass_filenames: false
        files: ^(data/05_certifications\.txt|frontend/src/app/certifications\.json)$

      - id: check-credentials
        name: Credentials consistent between data/ and the portfolio
        entry: python3 scripts/check_credentials.py
        language: system
        pass_filenames: false
        files: ^(data/0[145]_.*\.txt|frontend/src/app/(\[lang\]/portfolio-client\.js|dictionaries/.*\.json))$
