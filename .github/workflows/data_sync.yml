name: "Data Sync to S3"

on:
  workflow_dispatch: # Allow manual re-sync from the Actions tab / `gh workflow run`
  push:
    branches:
      - main # Update GIT_BRANCH env var below when changing branch
    paths:
      - 'data/**'

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read  # Required to checkout code

env:
  AWS_REGION: "eu-central-1"
  # Account ID comes from the AWS_ACCOUNT_ID repository variable (not hardcoded).
  AWS_ROLE_ARN: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/digital-twin-github-actions-role"
  # Update this when switching branches — also update 'on: push: branches' above and variables.tf default
  GIT_BRANCH: "main"
  TF_VAR_git_branch: "main"

jobs:
  sync:
    name: "Sync Local Data to S3 Knowledge Base"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Reads terraform/.terraform-version, same as terraform.yml. This was
      # hardcoded to 1.5.0 and missed when the versions were unified — which
      # would have broken this workflow outright, since it runs `terraform
      # output` against state now stamped 1.16.4 and 1.5.0 cannot read it.
      - name: Resolve Terraform version
        id: tfver
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}

      # Gate the sync: this workflow is the path by which a wrong certification
      # list reaches the twin. Checking before the upload means bad data never
      # gets embedded, rather than being corrected after visitors see it.
      - name: data/05_certifications.txt is generated, not hand-edited
        run: python3 scripts/generate_certifications.py --check

      - name: Credentials consistent between data/ and the portfolio
        run: python3 scripts/check_credentials.py

      - name: Sync to S3
        working-directory: ./terraform
        run: |
          # Initialize terraform to pull the remote state
          terraform init -no-color

          # Fetch the dynamically generated bucket name from Terraform outputs
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)

          echo "Syncing data/ to s3://$BUCKET_NAME/"

          # Sync the data folder to the bucket
          aws s3 sync ../data "s3://$BUCKET_NAME/" --delete
