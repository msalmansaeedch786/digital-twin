name: "Terraform CI/CD"

on:
  workflow_dispatch:
  push:
    branches:
      - main # Update GIT_BRANCH env var below when changing branch
  # Plan-only on PRs. The "Post Plan to PR" step below and the
  # ":pull_request" entry in the OIDC trust policy (oidc.tf) were both already
  # here, but nothing triggered the workflow on pull_request — so the plan
  # comment the README promises has never actually appeared. Apply stays gated
  # on refs/heads/main + push/workflow_dispatch, so a PR run plans and stops.
  pull_request:
    branches:
      - main

# Terraform holds a DynamoDB state lock for the length of a plan/apply, so two
# runs overlapping means the second dies on ConditionalCheckFailedException.
# Two pushes a minute apart is enough to trigger it. Queue runs instead, and
# never cancel one mid-apply: that would drop the lock with state half-written.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read  # Required to checkout code
  pull-requests: write # Required to post comments on PRs

env:
  AWS_REGION: "eu-central-1"
  # This role ARN will be created by the OIDC Terraform module.
  # Account ID comes from the AWS_ACCOUNT_ID repository variable (not hardcoded).
  AWS_ROLE_ARN: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/digital-twin-github-actions-role"
  # Update this when switching branches — also update 'on: push: branches' above and variables.tf default
  GIT_BRANCH: "main"
  TF_VAR_git_branch: "main"

jobs:
  terraform:
    name: "Terraform Build & Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so gitleaks can scan all commits

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Single source of truth for the Terraform version: terraform/.terraform-version,
      # which tfenv/asdf also read locally. Hardcoding it here is what let CI and
      # the developer machine drift four minor versions apart unnoticed.
      - name: Resolve Terraform version
        id: tfver
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}

      # No `cache: pip` here on purpose. The build-directory caches below are
      # keyed on the same requirements.txt hash, so the two always hit or miss
      # together: on a hit build.sh skips pip install entirely, ~/.cache/pip is
      # never created, and setup-python's post step fails the job on the
      # missing folder. On a miss the pip cache is empty anyway. It can never
      # save work here, and it can fail the run.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache API Build Directory
        uses: actions/cache@v4
        with:
          path: lambdas/api/build
          key: api-build-${{ hashFiles('lambdas/api/requirements.txt') }}

      - name: Cache Ingestion Build Directory
        uses: actions/cache@v4
        with:
          path: lambdas/ingestion/build
          key: ingest-build-${{ hashFiles('lambdas/ingestion/requirements.txt') }}

      # Same guard as the pre-commit hook, enforced for anyone who commits with
      # --no-verify or without the hooks installed. No AWS, no network.
      - name: Credentials consistent between data/ and the portfolio
        run: python scripts/check_credentials.py

      - name: Python Syntax Check
        run: |
          # Cheap gate: a syntax error in Lambda source must never reach deploy.
          python -m py_compile lambdas/api/main.py lambdas/api/ingest.py lambdas/ingestion/lambda_function.py lambdas/breaker/lambda_function.py

      - name: Build Python Lambda Packages
        run: |
          # Build the API Lambda
          cd lambdas/api
          ./build.sh
          cd ../..

          # Build the Ingestion Lambda
          cd lambdas/ingestion
          ./build.sh

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        run: terraform plan -no-color
        continue-on-error: true
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
